[project]
name = "welt-client"
version = "0.8.0"
description = "Welt Python client and scikit-learn estimators"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<1", "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2"]

[project.scripts]
welt = "welt.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=19,<30"]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "markdown>=3.7,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/welt"]
