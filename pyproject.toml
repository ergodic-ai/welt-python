[project]
name = "welt-client"
version = "0.1.0"
description = "Welt Python client and scikit-learn estimators"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<1", "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
parquet = ["pyarrow>=19,<30"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/welt"]
