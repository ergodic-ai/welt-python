name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            sklearn: '1.6.1'
          - python: '3.12'
            sklearn: '1.9.1'
          - python: '3.13'
            sklearn: '1.9.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.5.16
      - run: uv sync --frozen
      - run: uv pip install --python .venv/bin/python 'scikit-learn==${{ matrix.sklearn }}'
      - run: .venv/bin/python -m pytest -q
      - run: uv build
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - run: .venv/bin/python scripts/check_notebooks.py
      - run: .venv/bin/python scripts/build_docs.py
