name: SDK documentation
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published SDK release to document
        required: true
        default: v0.8.0
      docs_presentation_ref:
        description: Optional exact reviewed documentation-only commit (SDK0.8 only)
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: sdk-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.docs_presentation_ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard exact documentation presentation source
        if: inputs.docs_presentation_ref != ''
        env:
          DOCS_PRESENTATION_REF: ${{ inputs.docs_presentation_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/verify_docs_presentation.py
      - run: python -m pip install uv==0.5.16
      - run: uv sync --frozen --extra parquet
      - name: Verify matching published release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PYCODE'
          import json, os, tomllib, urllib.request
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + version:
              raise SystemExit('Documentation must check out its matching release tag.')
          request = urllib.request.Request(
              'https://api.github.com/repos/ergodic-ai/welt-python/releases/tags/' + tag,
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'Welt-SDK-docs'})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          assets = {asset['name'] for asset in release['assets']}
          required = {'welt_client-' + version + '-py3-none-any.whl', 'welt_client-' + version + '.tar.gz'}
          if release['draft'] or release['tag_name'] != tag or not required <= assets:
              raise SystemExit('Publish matching reviewed wheel and sdist before documentation.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SDK_VERSION=' + version + '\n')
          PYCODE
      - name: Install the published matching wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/$RELEASE_TAG/welt_client-$SDK_VERSION-py3-none-any.whl"
      - name: Verify frozen installed SDK presentation bytes
        if: inputs.docs_presentation_ref != ''
        run: |
          .venv/bin/python - <<'PYCODE'
          import pathlib, sysconfig, zipfile
          root = pathlib.Path(sysconfig.get_path('purelib'))
          with zipfile.ZipFile('/tmp/welt-docs-presentation-wheel.whl') as wheel:
              for name in wheel.namelist():
                  if not name.endswith('/') and not name.endswith('.dist-info/RECORD'):
                      assert (root / name).read_bytes() == wheel.read(name), name
          PYCODE
      - run: .venv/bin/python scripts/check_notebooks.py --check-source
      - name: Test docs-only presentation gate
        if: inputs.docs_presentation_ref != ''
        run: |
          .venv/bin/python -m pytest scripts/test_docs_presentation_guard.py scripts/test_homepage_presentation.py scripts/test_learning_materials.py -q
      # Preserve v0.6 URLs and corrected research archive/licence notices.
      # This is an isolated checkout/environment: historical docs cannot inherit 0.7 APIs.
      - uses: actions/checkout@v4
        with:
          ref: 1cea7d9998bf433bd4404add75ed9e2e35b2de87
          path: .legacy-sdk
      - run: uv sync --frozen
        working-directory: .legacy-sdk
      - run: uv build
        working-directory: .legacy-sdk
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
        working-directory: .legacy-sdk
      - run: .venv/bin/python scripts/build_historical_docs.py --source .legacy-sdk --output site
      # Preserve immutable 0.7 routes and its original published wheel as well.
      - uses: actions/checkout@v4
        with:
          ref: 0d7719f410061ac41f9fdc0428cfe44148999489
          path: .legacy-sdk07
      - run: uv sync --frozen
        working-directory: .legacy-sdk07
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.7.0/welt_client-0.7.0-py3-none-any.whl"
        working-directory: .legacy-sdk07
      - run: .venv/bin/python scripts/build_historical_docs.py --source .legacy-sdk07 --version 0.7.0 --output site
      # Old 0.7.1 package/guides remain immutable; requested landing correction only.
      - uses: actions/checkout@v4
        with:
          ref: a14e880ea17fa4114bacf7b269283c4db8327678
          path: .legacy-sdk071
      - run: uv sync --frozen
        working-directory: .legacy-sdk071
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.7.1/welt_client-0.7.1-py3-none-any.whl"
        working-directory: .legacy-sdk071
      - uses: actions/checkout@v4
        if: inputs.docs_presentation_ref != ''
        with:
          ref: 49699b14ebc10bcb093c9cf208518dd5ea3a0c46
          path: .presentation-baseline
      - name: Render immutable accepted 0.7.1 presentation
        if: inputs.docs_presentation_ref != ''
        run: .venv/bin/python .presentation-baseline/scripts/build_historical_docs.py --source .legacy-sdk071 --version 0.7.1 --output site
      - run: .venv/bin/python scripts/build_historical_docs.py --source .legacy-sdk071 --version 0.7.1 --output site
        if: inputs.docs_presentation_ref == ''
      - run: .venv/bin/python scripts/build_docs.py
      - run: test -f site/v0.6.0/index.html && test -f site/v0.6.0/research-datasets.html && test -f site/v0.7.0/index.html && test -f site/v0.7.1/index.html && test -f site/v0.8.0/index.html
      - name: Bind documentation presentation proof
        if: inputs.docs_presentation_ref != ''
        run: cp /tmp/welt-docs-presentation-proof.json site/docs-presentation-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
