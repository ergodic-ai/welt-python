name: SDK documentation
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published SDK release to document
        required: true
        default: v0.13.0
      docs_presentation_ref:
        description: Optional exact reviewed documentation-only commit (SDK0.8 or SDK0.10)
        required: false
        default: ""
permissions:
  contents: read
env:
  WELT_REQUIRE_BROWSER_CHECKS: '1'
concurrency:
  group: sdk-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.docs_presentation_ref || format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard exact documentation presentation source
        if: inputs.docs_presentation_ref != ''
        env:
          DOCS_PRESENTATION_REF: ${{ inputs.docs_presentation_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/verify_docs_presentation.py
      - run: python -m pip install uv==0.5.16
      - run: uv sync --frozen --extra parquet
      - name: Verify matching published release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PYCODE'
          import json, os, tomllib, urllib.request
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + version:
              raise SystemExit('Documentation must check out its matching release tag.')
          request = urllib.request.Request(
              'https://api.github.com/repos/ergodic-ai/welt-python/releases/tags/' + tag,
              headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'Welt-SDK-docs'})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          assets = {asset['name'] for asset in release['assets']}
          required = {'welt_client-' + version + '-py3-none-any.whl', 'welt_client-' + version + '.tar.gz'}
          if release['draft'] or release['tag_name'] != tag or not required <= assets:
              raise SystemExit('Publish matching reviewed wheel and sdist before documentation.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SDK_VERSION=' + version + '\n')
          PYCODE
      - name: Install the published matching wheel
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/$RELEASE_TAG/welt_client-$SDK_VERSION-py3-none-any.whl"
      - name: Verify frozen installed SDK presentation bytes
        if: inputs.docs_presentation_ref != ''
        run: |
          .venv/bin/python - <<'PYCODE'
          import pathlib, sysconfig, zipfile
          root = pathlib.Path(sysconfig.get_path('purelib'))
          with zipfile.ZipFile('/tmp/welt-docs-presentation-wheel.whl') as wheel:
              for name in wheel.namelist():
                  if not name.endswith('/') and not name.endswith('.dist-info/RECORD'):
                      assert (root / name).read_bytes() == wheel.read(name), name
          PYCODE
      - run: .venv/bin/python scripts/check_notebooks.py --check-source
      - name: Test docs-only presentation gate
        if: inputs.docs_presentation_ref != ''
        run: |
          .venv/bin/python -m pytest scripts/test_docs_presentation_guard.py scripts/test_homepage_presentation.py scripts/test_learning_materials.py scripts/test_notebook_views.py -q
      # Preserve v0.6 URLs and corrected research archive/licence notices.
      # This is an isolated checkout/environment: historical docs cannot inherit 0.7 APIs.
      - uses: actions/checkout@v4
        with:
          ref: 1cea7d9998bf433bd4404add75ed9e2e35b2de87
          path: .legacy-sdk
      - run: uv sync --frozen
        working-directory: .legacy-sdk
      - run: uv build
        working-directory: .legacy-sdk
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
        working-directory: .legacy-sdk
      - run: .venv/bin/python scripts/build_historical_docs.py --source .legacy-sdk --output site
      # Preserve immutable 0.7 routes and its original published wheel as well.
      - uses: actions/checkout@v4
        with:
          ref: 0d7719f410061ac41f9fdc0428cfe44148999489
          path: .legacy-sdk07
      - run: uv sync --frozen
        working-directory: .legacy-sdk07
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.7.0/welt_client-0.7.0-py3-none-any.whl"
        working-directory: .legacy-sdk07
      - run: .venv/bin/python scripts/build_historical_docs.py --source .legacy-sdk07 --version 0.7.0 --output site
      # Old 0.7.1 package/guides remain immutable; requested landing correction only.
      - uses: actions/checkout@v4
        with:
          ref: a14e880ea17fa4114bacf7b269283c4db8327678
          path: .legacy-sdk071
      - run: uv sync --frozen
        working-directory: .legacy-sdk071
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.7.1/welt_client-0.7.1-py3-none-any.whl"
        working-directory: .legacy-sdk071
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag == 'v0.8.0' && '49699b14ebc10bcb093c9cf208518dd5ea3a0c46' || 'f41f37e1b69f178969707f8b31e58b85e71fb158' }}
          path: .presentation-baseline
      - name: Render immutable accepted 0.7.1 presentation
        run: .venv/bin/python .presentation-baseline/scripts/build_historical_docs.py --source .legacy-sdk071 --version 0.7.1 --output site
      # Retain all intervening released guides in their matching environments.
      # 0.8 uses the accepted docs-only presentation revision; published runtime
      # still comes from its immutable release wheel.
      - uses: actions/checkout@v4
        with:
          ref: c568691e9280215250d82f0f8b0578a16a2dce92
          path: .legacy-sdk08
      - run: uv sync --frozen
        working-directory: .legacy-sdk08
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.8.0/welt_client-0.8.0-py3-none-any.whl"
        working-directory: .legacy-sdk08
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        working-directory: .legacy-sdk08
      - uses: actions/checkout@v4
        with:
          ref: 8c0b26550442b89a286b0a07c7a7fe00a1d4cd91
          path: .legacy-sdk091
      - run: uv sync --frozen
        working-directory: .legacy-sdk091
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.9.1/welt_client-0.9.1-py3-none-any.whl"
        working-directory: .legacy-sdk091
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        working-directory: .legacy-sdk091
      # Keep the accepted 0.10.0 presentation with its immutable runtime.
      - uses: actions/checkout@v4
        if: github.event.release.tag_name == 'v0.10.1' || inputs.release_tag == 'v0.10.1' || github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        with:
          ref: 3d2a805fd334636df3470b08eb3b451a630e6968
          path: .legacy-sdk010
      - run: uv sync --frozen --extra parquet
        if: github.event.release.tag_name == 'v0.10.1' || inputs.release_tag == 'v0.10.1' || github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk010
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.10.0/welt_client-0.10.0-py3-none-any.whl"
        if: github.event.release.tag_name == 'v0.10.1' || inputs.release_tag == 'v0.10.1' || github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk010
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        if: github.event.release.tag_name == 'v0.10.1' || inputs.release_tag == 'v0.10.1' || github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk010
      # Retain the preceding documentation-only release with its exact wheel.
      - uses: actions/checkout@v4
        if: github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        with:
          ref: 1bc1c2992e74b687775735c1aa0aa9c0ceacccea
          path: .legacy-sdk0101
      - run: uv sync --frozen --extra parquet
        if: github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0101
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.10.1/welt_client-0.10.1-py3-none-any.whl"
        if: github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0101
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        if: github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0101
      # Retain the Forecast release documentation with its exact wheel.
      - uses: actions/checkout@v4
        if: github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        with:
          ref: b306db9767f48bae3d14fed5da2f59815c644b0b
          path: .legacy-sdk0110
      - run: uv sync --frozen --extra parquet
        if: github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0110
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.11.0/welt_client-0.11.0-py3-none-any.whl"
        if: github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0110
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        if: github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1' || github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0110
      # Retain the preceding package-description release with its exact wheel.
      - uses: actions/checkout@v4
        if: github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        with:
          ref: 001a1ede1144b53423c1f1e44e7e9af49ad4fd7f
          path: .legacy-sdk0111
      - run: uv sync --frozen --extra parquet
        if: github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0111
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.11.1/welt_client-0.11.1-py3-none-any.whl"
        if: github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0111
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        if: github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0111
      # Retain the Evaluations release guides with their exact wheel.
      - uses: actions/checkout@v4
        if: github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        with:
          ref: 72fd33f751094301dfa8ae8962a23fa7e4e51d55
          path: .legacy-sdk0120
      - run: uv sync --frozen --extra parquet
        if: github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0120
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps "https://github.com/ergodic-ai/welt-python/releases/download/v0.12.0/welt_client-0.12.0-py3-none-any.whl"
        if: github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0120
      - run: .venv/bin/python scripts/build_docs.py --output ../site
        if: github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        working-directory: .legacy-sdk0120
      - name: Check current documentation contracts
        run: .venv/bin/python -m pytest -q scripts/test_audit_navigation.py scripts/test_audit_content.py scripts/test_homepage_presentation.py scripts/test_learning_materials.py scripts/test_notebook_views.py scripts/test_graphite_presentation.py scripts/test_docs_browser.py
      - run: .venv/bin/python scripts/build_docs.py
        env:
          DOCS_NOTEBOOK_REF: ${{ inputs.docs_presentation_ref || github.sha }}
      - run: test -f site/v0.6.0/index.html && test -f site/v0.6.0/research-datasets.html && test -f site/v0.7.0/index.html && test -f site/v0.7.1/index.html && test -f site/v0.8.0/index.html && test -f site/v0.9.1/index.html
      - name: Verify Forecast and preceding release documentation
        if: github.event.release.tag_name == 'v0.11.0' || inputs.release_tag == 'v0.11.0' || github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1'
        run: |
          test -f site/v0.10.0/index.html
          test -f site/v0.10.1/index.html
          test -f site/v0.11.0/forecasting.html
          test -f site/v0.11.0/reference.html
          test -f site/v0.11.0/downloads/forecasting.py
          grep -q 'Forecast.predict_quantiles' site/v0.11.0/reference.html
      - name: Verify retained Forecast release documentation
        if: github.event.release.tag_name == 'v0.11.1' || inputs.release_tag == 'v0.11.1'
        run: |
          test -f site/v0.11.0/index.html
          test -f site/v0.11.1/forecasting.html
          grep -q 'Forecast.predict_quantiles' site/v0.11.1/reference.html
      - name: Verify Evaluations and preceding release documentation
        if: github.event.release.tag_name == 'v0.12.0' || inputs.release_tag == 'v0.12.0' || github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        run: |
          test -f site/v0.10.0/index.html
          test -f site/v0.10.1/index.html
          test -f site/v0.11.0/index.html
          test -f site/v0.11.0/forecasting.html
          grep -q 'Forecast.predict_quantiles' site/v0.11.0/reference.html
          test -f site/v0.11.1/index.html
          test -f site/v0.11.1/forecasting.html
          grep -q 'value="../v0.11.0/"' site/v0.11.1/index.html
          grep -q 'welt.ergodic.dev/llms.txt' site/v0.11.1/llms.txt
          test -f site/v0.12.0/evaluations.html
          test -f site/v0.12.0/notebook-evaluation.html
          test -f site/v0.12.0/downloads/evaluation.py
          test -f site/v0.12.0/downloads/evaluation.ipynb
          grep -q 'Evaluation.summary' site/v0.12.0/reference.html
          grep -q 'welt.ergodic.dev/llms.txt' site/llms.txt
          grep -q 'value="v0.11.1/"' site/index.html
          grep -q 'value="v0.11.0/"' site/index.html
          grep -q 'value="../v0.11.1/"' site/v0.12.0/index.html
          grep -q 'value="../v0.11.0/"' site/v0.12.0/index.html
          grep -q '/v0.11.1/' site/sitemap.xml
          grep -q '/v0.11.0/' site/sitemap.xml
          python3 -c "import json; v = json.load(open('site/v0.12.0/manifest.json'))['historical_versions']; assert {'0.11.0', '0.11.1'} <= set(v), v"
      - name: Verify ergodic bridge and preceding release documentation
        if: github.event.release.tag_name == 'v0.13.0' || inputs.release_tag == 'v0.13.0'
        run: |
          test -f site/v0.12.0/index.html
          test -f site/v0.12.0/evaluations.html
          test -f site/v0.11.1/index.html
          test -f site/v0.13.0/causal-discovery.html
          grep -q 'welt-client\[ergodic\]' site/v0.13.0/causal-discovery.html
          grep -q 'https://ergodic.dev/' site/v0.13.0/causal-discovery.html
          grep -q 'value="../v0.12.0/"' site/v0.13.0/index.html
          grep -q 'value="v0.12.0/"' site/index.html
          grep -q '/v0.12.0/' site/sitemap.xml
          python3 -c "import json; v = json.load(open('site/v0.13.0/manifest.json'))['historical_versions']; assert {'0.11.1', '0.12.0'} <= set(v), v"
      - name: Bind documentation presentation proof
        if: inputs.docs_presentation_ref != ''
        run: cp /tmp/welt-docs-presentation-proof.json site/docs-presentation-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
